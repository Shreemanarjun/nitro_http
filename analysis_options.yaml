include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Owned by nitro_generator (0.5.17) and rewritten on every codegen run, so
    # a hand fix would not survive. Its async unpack thunks declare untyped
    # `(raw)` parameters, which strict-inference rejects.
    - lib/src/nitro_http.g.dart
    - lib/src/generated/native/**
    # Re-scaffolded by every `nitrogen link` run and left untracked. It is the
    # template for the WASM web build, which this package does not use — web
    # runs on `fetch`, and its real test lives in test_web/.
    - test/nitro_http_web_test.dart
    # Added by `nitrogen generate`. Committed so the codegen-is-a-no-op CI job
    # stays green: nitrogen appends these when they are missing, and a fresh
    # checkout would otherwise differ from the tree every run.
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # an inexhaustive switch over a sealed type must not be a warning
    non_exhaustive_switch_statement: error
    non_exhaustive_switch_expression: error

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
