plugins {
    id "com.android.library"
    // No Kotlin plugin: nitro_http has no JVM code. The Nitro spec declares
    // `AndroidNativeImpl.cpp`, so Android talks to the engine through
    // dart:ffi and never through JNI. Flutter's build infrastructure would
    // apply KGP automatically anyway — adding "org.jetbrains.kotlin.android"
    // here triggers a deprecation warning and will break in future Flutter
    // versions.
    // See: https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin
}

group = "dev.shreeman.nitro_http"
version = "1.0"

android {
    kotlinOptions { jvmTarget = "17" }
    sourceSets {
        main {
            kotlin.srcDirs += "${project.projectDir}/../lib/src/generated/kotlin"
        }
    }
    namespace = "dev.shreeman.nitro_http"
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    externalNativeBuild {
        // src/CMakeLists.txt includes deps.cmake (resolves the prebuilt
        // libcurl slice for ANDROID_ABI) and engine.cmake (compiles
        // src/engine/*.cpp). No `arguments` are needed: AGP already passes
        // ANDROID_ABI/ANDROID_PLATFORM, and ANDROID_STL defaults to
        // c++_shared, which is what a Flutter app wants — every plugin .so in
        // the APK then shares one libc++_shared.so instead of statically
        // duplicating the runtime.
        cmake { path = "../src/CMakeLists.txt" }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildTypes {
        // Flutter's profile variant: without an explicit profile buildType,
        // AGP builds the plugin's CMake code with the DEBUG config — the
        // whole native library ships at -O0 in profile mode. Inherit release
        // so profile builds measure optimized native code.
        profile {
            initWith release
        }
    }

    defaultConfig {
        consumerProguardFiles "consumer-rules.pro"
        minSdk = 24

        ndk {
            // The three ABIs deps/versions.cmake pins a libcurl slice for.
            //
            // Restricting ABIs is normally the app's call, not a plugin's — but
            // this plugin CANNOT build an ABI it has no prebuilt dependency
            // for, so this is a constraint rather than a policy.
            //
            // Without it the build breaks, and not obviously. Flutter applies
            // its own abiFilters to the APP module's buildTypes, and that does
            // not reach a library module's externalNativeBuild. A library with
            // no filters gets the NDK's default set, which is FOUR ABIs — the
            // three below plus 32-bit `x86` (`default: true` in the NDK's
            // meta/abis.json). AGP then really does create a
            // `buildCMakeDebug[x86]` task for this plugin.
            //
            // That task has no slice to download: there is no
            // NH_SLICE_android-x86_SHA256, so src/deps.cmake falls through to
            // its system-libcurl path, and Android has no system libcurl. The
            // failure surfaces as `#include <curl/curl.h>` not found — which
            // points at the engine sources rather than at a missing pin four
            // files away.
            //
            // Nothing is lost by excluding it. Flutter's PLATFORM_ARCH_MAP maps
            // only android-arm/arm64/x64 to armeabi-v7a/arm64-v8a/x86_64 and
            // throws on anything else, so no Flutter app can target 32-bit x86
            // in the first place. This list IS Flutter's full supported set.
            //
            // If a slice for a new ABI is ever published, add the pin to
            // deps/versions.cmake and the ABI here, together.
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"
}
