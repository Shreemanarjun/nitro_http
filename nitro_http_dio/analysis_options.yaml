include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # an inexhaustive switch over a sealed type must not be a warning
    non_exhaustive_switch_statement: error
    non_exhaustive_switch_expression: error

linter:
  rules:
    # Every public member of this package is API surface for dio users, so
    # missing documentation is a defect rather than a style preference.
    - public_member_api_docs
